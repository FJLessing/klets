[package]
name = "klets"
version = "0.1.0"
description = "Spotlight-style quick answers from ACP coding agents"
authors = ["FJ Lessing <me@fjlessing.co.za>"]
license = "MIT"
repository = "https://github.com/FJLessing/klets"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "klets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-client-protocol = { version = "0.9", features = ["unstable_session_model"] }
async-trait = "0.1"
futures = "0.3"
# Each native feature is gated on its own target_os inside keyring; without
# the matching one for the platform being built, keyring silently falls back
# to an in-memory mock store that reports every save as successful and then
# forgets it. `linux-native-sync-persistent` is keyring's own recommended
# Linux combo (Secret Service — GNOME Keyring/KWallet — falling back to the
# kernel keyring when no Secret Service is running); `crypto-rust` avoids
# requiring libssl-dev on the Linux build host. Linux-only deps these pull in
# are gated on `target_os = "linux"` inside the keyring crate itself, so they
# add nothing to the macOS or Windows build.
keyring = { version = "3", features = [
    "windows-native",
    "apple-native",
    "linux-native-sync-persistent",
    "crypto-rust",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# macos-private-api is what lets `transparent: true` actually take effect on
# macOS; without it Tauri silently builds an opaque launcher window.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
